# On every push to master: build the CLI and the command center and publish
# them to the "latest" release. Nothing is deployed from here; the command
# center is updated only when an agent runs `delta update-cc <binary-url>`.
name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} \
              go build -trimpath -ldflags="-s -w" -o "dist/delta-${target%/*}-${target#*/}" ./cmd/delta
          done
          for target in linux/amd64 linux/arm64; do
            # Embeds the `delta music` engine for this platform (if it has one).
            scripts/fetch-music-engine.sh ${target%/*} ${target#*/}
            GOOS=${target%/*} GOARCH=${target#*/} \
              go build -trimpath -ldflags="-s -w" -o "dist/delta-cc-${target%/*}-${target#*/}" ./cmd/delta-cc
          done
          # The setup script that downloads the right `delta` build and puts it on PATH.
          cp scripts/install.sh dist/install.sh
      - name: Self-test delta-cc
        run: ./dist/delta-cc-linux-amd64 test
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          cat > notes.md <<'EOF'
          Built automatically from master.

          **Setup script:** `install.sh` downloads the `delta` CLI for your system (Linux or macOS, x86_64 or arm64) and puts it on your PATH:

          ```
          curl -fsSL https://github.com/thooton/delta/releases/download/latest/install.sh | sh
          ```

          Or download the `delta-<os>-<arch>` binary for your platform directly. Then run `delta help`.
          EOF
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Delta (latest)" --notes-file notes.md
          gh release edit latest --notes-file notes.md
          # --clobber deletes each old asset before uploading its replacement,
          # so a failed upload (GitHub sometimes answers 500) leaves the
          # release without it. Retry rather than leave it that way.
          for try in 1 2 3 4 5; do
            gh release upload latest dist/* --clobber && exit 0
            echo "upload failed (try $try); retrying" >&2
            sleep $((try * 10))
          done
          exit 1
